<style>
:root{
  --bg:#0b0d1a;--card:#141833;--card2:#1b2045;--line:rgba(255,255,255,.09);
  --text:#f3f5ff;--muted:#a9b0d6;--green:#6ff0b8;--teal:#2fd3c6;--purple:#c3a6ff;--pink:#ff7ad9;--red:#ff4d6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;font-family:"Inter",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 50% -10%,rgba(111,240,184,.13),transparent 60%),
    radial-gradient(700px 500px at 100% 100%,rgba(195,166,255,.10),transparent 60%),
    var(--bg);
  display:flex;justify-content:center;padding:40px 16px 56px}
.wrap{width:100%;max-width:440px}
/* pixel avatar */
.avatar{width:104px;height:104px;margin:0 auto;border-radius:24px;position:relative;
  background:linear-gradient(135deg,#1f8f5f,#2fd3c6);box-shadow:0 10px 30px rgba(47,211,198,.25),inset 0 0 0 3px rgba(255,255,255,.12);
  display:grid;place-items:center;overflow:hidden}
.avatar::before{content:"";position:absolute;inset:0;
  background:
    linear-gradient(rgba(0,0,0,.10) 50%,transparent 50%) 0 0/100% 13px,
    linear-gradient(90deg,rgba(0,0,0,.10) 50%,transparent 50%) 0 0/13px 100%;opacity:.55}
.avatar span{position:relative;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:38px;letter-spacing:-1px;
  color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
h1{margin-top:18px;text-align:center;font-size:34px;font-weight:900;letter-spacing:-.5px}
.handle{margin-top:4px;text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.bio{margin:14px auto 0;max-width:340px;text-align:center;color:#d6dbf5;font-size:15.5px;line-height:1.5;font-weight:500}
.live{margin:18px auto 0;width:max-content;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
  background:rgba(255,77,106,.10);border:1.5px solid rgba(255,77,106,.45);color:#ffd5dc;font-weight:800;font-size:14px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,77,106,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,106,.55)}70%{box-shadow:0 0 0 10px rgba(255,77,106,0)}100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}}
.links{margin-top:28px;display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;text-decoration:none;color:var(--text);
  background:var(--card);border:1.5px solid var(--line);transition:transform .15s ease,border-color .15s ease,background .15s ease}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:rgba(111,240,184,.55);background:var(--card2);outline:none}
a.btn.main{background:linear-gradient(135deg,rgba(111,240,184,.16),rgba(47,211,198,.10));border-color:rgba(111,240,184,.45)}
.ico{flex:0 0 44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#0e1121;border:1.5px solid var(--line)}
.ico svg{width:24px;height:24px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:16.5px;font-weight:800}
.txt small{display:block;margin-top:2px;color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--muted);font-weight:800;font-size:20px}
.foot{margin-top:34px;text-align:center;color:#6f7699;font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion:reduce){.live i{animation:none}a.btn{transition:none}}
</style>
</head>
