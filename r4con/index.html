:root{--altin:#ffcf3f;--altin-g:#6b4700;--kirmizi:#ff3b4e;--kirmizi-g:#5e0b16;--xp:#80e02a;--xp-g:#2f5a0b;--panel:rgba(18,16,26,.9);--yuva:#37323f;--yazi:#f4f2f8;--soluk:#9a94a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent!important;overflow:hidden}
body{width:320px;font-family:Rubik,sans-serif;color:var(--yazi);-webkit-font-smoothing:antialiased}
.pix{font-family:"Pixelify Sans",monospace;font-weight:700}

/* panel: chunky pixel bevel, stepped corners */
.taht{position:relative;margin-bottom:10px;padding:9px 12px 11px;background:var(--panel);--renk:var(--altin);--renk-g:var(--altin-g);
 box-shadow:inset 3px 3px 0 rgba(255,255,255,.13),inset -3px -3px 0 rgba(0,0,0,.6);
 clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.taht.k2{--renk:var(--kirmizi);--renk-g:var(--kirmizi-g)}
.taht:last-child{margin-bottom:0}
.taht::before{content:"";position:absolute;inset:0;border:3px solid var(--renk);opacity:0;pointer-events:none}

.unvan{display:flex;align-items:center;gap:8px;height:32px}
.unvan svg{width:22px;height:20px;display:block;flex:0 0 auto;filter:drop-shadow(2px 2px 0 var(--renk-g))}
.unvan .hk{fill:var(--renk)}
.unvan .hp{fill:#fff;opacity:.8}
.unvan h2{font-size:31px;line-height:1;letter-spacing:.04em;color:var(--renk);text-shadow:3px 3px 0 var(--renk-g)}
.k2 .unvan{height:26px}
.k2 .unvan svg{width:18px;height:16px}
.k2 .unvan h2{font-size:24px;text-shadow:2px 2px 0 var(--renk-g)}

.satir{display:flex;align-items:center;gap:12px;margin-top:7px}
.yuva{position:relative;flex:0 0 auto;background:var(--yuva);box-shadow:inset 3px 3px 0 rgba(0,0,0,.55),inset -3px -3px 0 rgba(255,255,255,.16)}
.av{width:78px;height:78px;padding:5px}
.k2 .av{width:58px;height:58px;padding:4px}
.av img,.av span{display:block;width:100%;height:100%;object-fit:cover}
.av span{display:grid;place-items:center;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:30px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.taht.bos .av span{background:transparent;color:#5d5769;font-size:38px;text-shadow:none}
.k2.bos .av span{font-size:28px}

.bilgi{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ad{font-size:24px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.k2 .ad{font-size:20px}
.taht.bos .ad{color:var(--soluk);font-weight:500}
.yigin{display:flex;align-items:center;gap:10px}
.esya{width:42px;height:42px;display:grid;place-items:center}
.k2 .esya{width:34px;height:34px}
.esya img{width:30px;height:30px;object-fit:contain;display:block}
.k2 .esya img{width:24px;height:24px}
.esya .soru{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:20px;color:#5d5769}
.say{position:absolute;right:-7px;bottom:-9px;font-family:Rubik,sans-serif;font-weight:700;font-size:26px;line-height:1;color:#fff;text-shadow:3px 3px 0 #3a3a3a;font-variant-numeric:tabular-nums;white-space:nowrap}
.k2 .say{font-size:22px;right:-6px;bottom:-8px;text-shadow:2px 2px 0 #3a3a3a}
.taht.bos .say{display:none}
.say.vur{animation:vur .5s cubic-bezier(.2,.8,.2,1)}
@keyframes vur{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.ne{font-size:15px;font-weight:500;color:var(--soluk);line-height:1.15;padding-left:10px}
.ne b{display:block;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:19px;color:var(--renk)}
.k2 .ne{font-size:14px}
.k2 .ne b{font-size:17px}

/* bottom: what it takes + closest challenger on an XP-style bar */
.hedef{margin-top:11px}
.hedef .yazi{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:500;color:var(--soluk);line-height:1.1;white-space:nowrap}
.hedef .yazi b{color:var(--yazi);font-weight:700}
.hedef .yazi img{width:16px;height:16px;object-fit:contain;align-self:center}
.rakip{margin-left:auto;min-width:0;max-width:48%;overflow:hidden;text-overflow:ellipsis;color:var(--xp);font-weight:700}
.rakip[hidden]{display:none}
.xp{position:relative;height:9px;margin-top:5px;background:#17140f;box-shadow:0 0 0 2px #000}
.xp i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:linear-gradient(#b6ff5c 0 34%,var(--xp) 34% 70%,#4c9a12 70%);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#000 calc(10% - 2px) 10%)}
.k2 .hedef{margin-top:9px}

/* the takeover moment */
.yeni{position:absolute;right:14px;bottom:10px;padding:3px 9px 4px;background:var(--renk);color:#140f00;font-size:22px;line-height:1;letter-spacing:.03em;box-shadow:3px 3px 0 var(--renk-g);opacity:0;transform:rotate(-4deg);pointer-events:none;white-space:nowrap}
.k2 .yeni{font-size:19px;bottom:9px;color:#fff}
.taht.devir .yeni{animation:damga 4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes damga{0%{opacity:0;transform:rotate(-4deg) scale(2)}9%{opacity:1;transform:rotate(-4deg) scale(.92)}14%{transform:rotate(-4deg) scale(1)}88%{opacity:1;transform:rotate(-4deg) scale(1)}100%{opacity:0;transform:rotate(-4deg) scale(1)}}
.taht.devir::before{animation:cerceve 1.6s steps(1) 2}
@keyframes cerceve{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:0}}
.taht.devir .av{animation:otur .8s cubic-bezier(.2,.8,.2,1)}
@keyframes otur{0%{transform:scale(1.3);filter:brightness(2.4)}100%{transform:none;filter:none}}
.parca{position:absolute;width:6px;height:6px;background:var(--renk);box-shadow:2px 2px 0 var(--renk-g);pointer-events:none}

.nokta{position:fixed;right:4px;top:4px;width:9px;height:9px;background:#ff5a5a;display:none;z-index:9}
.nokta.acik{background:#45c97a}
body.durum .nokta{display:block}
@media (prefers-reduced-motion:reduce){.taht.devir .av,.taht.devir::before,.say.vur{animation:none}}
</style>
</head>

 var ANAHTAR='rhaelv-r4con-v1'+(DEMO||ONIZ?'-deneme':'');
 var YENI_YAYIN_MS=90*60*1000;
 // bağlı hediyeler: RhaelV seçince buraya yazılacak (adres ekiyle de değişir)
 var VARSAYILAN={b1:'',b2:'',i1:'',i2:''};
 function par(k){var v=q.get(k);return v!=null&&v!==''?v:VARSAYILAN[k];}
 function norm(s){return String(s||'').toLocaleLowerCase('en').replace(/[^a-z0-9]/g,'');}
 var YER=[
  {no:1,unvan:(q.get('u1')||'R4CON').slice(0,14),bagli:par('b1'),ikon:par('i1')},
  {no:2,unvan:(q.get('u2')||'R4CONCUK').slice(0,14),bagli:par('b2'),ikon:par('i2')}];
 if(DEMO||ONIZ){YER[0].bagli=YER[0].bagli||'Donut';YER[1].bagli=YER[1].bagli||'Rose';}
 YER.forEach(function(y){
  y.adlar=String(y.bagli).split(',').map(function(s){return s.trim();}).filter(Boolean);
  y.anahtar=y.adlar.map(norm).sort().join(',')||('bos'+y.no);
 });

 var S={rekor:{},oturum:{},ikon:{},son:0,kombo:{}};
 try{var k=JSON.parse(localStorage.getItem(ANAHTAR)||'null');if(k&&k.rekor)S=k;}catch(e){}
 if(DEMO||ONIZ)S={rekor:{},oturum:{},ikon:{},son:0,kombo:{}};
 S.oturum=S.oturum||{};S.ikon=S.ikon||{};S.kombo=S.kombo||{};
 var yeniYayin=S.son&&Date.now()-S.son>YENI_YAYIN_MS;
 if(yeniYayin){S.oturum={};S.kombo={};}
 var kayitBekle=null;
 function kaydet(hemen){
  if(DEMO||ONIZ)return;
  clearTimeout(kayitBekle);
  var yap=function(){try{localStorage.setItem(ANAHTAR,JSON.stringify(S));}catch(e){}};
  if(hemen)yap();else kayitBekle=setTimeout(yap,1500);
 }

 /* cards */
 var kok=document.getElementById('kok'),kalip=document.getElementById('kalip');
 YER.forEach(function(y){
  var el=kalip.content.firstElementChild.cloneNode(true);
  el.classList.add('k'+y.no);el.querySelector('h2').textContent=y.unvan;
  el.querySelector('.yeni').textContent='YENİ '+y.unvan+'!';
  y.el=el;kok.appendChild(el);
 });

 function bas(ad){var c=Array.from(String(ad).replace(/[^\p{L}\p{N}]/gu,''))[0]||'?';return c.toLocaleUpperCase('tr-TR');}
 function renk(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return 'hsl('+(h%360)+' 34% 38%)';}
 function sayi(n){return Number(n).toLocaleString('tr-TR');}
 function resim(kutu,src,yedek,harf){
  var sira=[src,yedek].filter(Boolean),i=0;
  if(kutu.dataset.src===sira.join('|')&&kutu.firstChild)return;
  kutu.dataset.src=sira.join('|');
  Array.prototype.slice.call(kutu.childNodes).forEach(function(c){if(!c.classList||!c.classList.contains('say'))c.remove();});
  function dene(){
   if(i>=sira.length){if(harf)kutu.insertBefore(harf(),kutu.firstChild);return;}
   var img=new Image();img.alt='';img.referrerPolicy='no-referrer';img.decoding='async';
   img.onerror=function(){img.remove();i++;dene();};
   img.src=sira[i];kutu.insertBefore(img,kutu.firstChild);
  }
  dene();
 }
 function ikonu(y){return S.ikon[y.anahtar]||y.ikon||'';}
 function ciz(y,olay){
  var el=y.el,r=S.rekor[y.anahtar],ik=ikonu(y);
  el.classList.toggle('bos',!r);
  var av=el.querySelector('.av');
  if(r){
   el.querySelector('.ad').textContent=r.ad;
   resim(av,r.foto,r.fotoV,function(){var s=document.createElement('span');s.textContent=bas(r.ad);s.style.background=renk(r.id);return s;});
  }else{
   el.querySelector('.ad').textContent='Boş';
   av.dataset.src='';av.textContent='';var s=document.createElement('span');s.textContent='?';av.appendChild(s);
  }
  var esya=el.querySelector('.esya');
  if(ik)resim(esya,ik,'',function(){var s=document.createElement('span');s.className='soru';s.textContent='?';return s;});
  else if(!esya.querySelector('.soru')){esya.dataset.src='';Array.prototype.slice.call(esya.childNodes).forEach(function(c){if(!c.classList||!c.classList.contains('say'))c.remove();});var s=document.createElement('span');s.className='soru';s.textContent='?';esya.insertBefore(s,esya.firstChild);}
  var say=el.querySelector('.say'),yeniSay=r?sayi(r.n):'';
  if(say.textContent!==yeniSay){if(say.textContent&&olay==='artti'){say.classList.remove('vur');void say.offsetWidth;say.classList.add('vur');}say.textContent=yeniSay;}
  var ne=el.querySelector('.ne');ne.textContent='';
  if(r){var gun=Math.floor((Date.now()-r.t)/86400000),b=document.createElement('b');b.textContent=gun<1?'Bugün aldı':gun+' gündür';ne.appendChild(b);ne.append('rekor onda');}
  else ne.textContent='Henüz kimse yok';
  // target + closest challenger
  var hedef=r?r.n+1:1,ilk=el.querySelector('.ilk');ilk.textContent='';
  if(ik){var im=new Image();im.alt='';im.referrerPolicy='no-referrer';im.src=ik;im.onerror=function(){im.remove();};ilk.appendChild(im);ilk.append(' ');}
  var bb=document.createElement('b');bb.textContent=r?sayi(hedef)+' atan':'İlk atan';ilk.appendChild(bb);ilk.append(' '+y.unvan+' olur');
  var en=null,ot=S.oturum[y.anahtar]||{};
  Object.keys(ot).forEach(function(id){var o=ot[id];if(r&&id===r.id)return;if(!en||o.n>en.n)en=o;});
  var rk=el.querySelector('.rakip');
  if(en&&r&&en.n>0){rk.hidden=false;rk.textContent=en.ad+' '+sayi(en.n);el.style.setProperty('--p',Math.min(1,en.n/hedef).toFixed(3));}
  else{rk.hidden=true;el.style.setProperty('--p','0');}
  if(olay==='devir')devir(y);
 }
 function devir(y){
  var el=y.el;el.classList.remove('devir');void el.offsetWidth;el.classList.add('devir');
  clearTimeout(el._dv);el._dv=setTimeout(function(){el.classList.remove('devir');},4100);
  if(!el.animate)return;
  var av=el.querySelector('.av'),ka=el.getBoundingClientRect(),aa=av.getBoundingClientRect();
  var cx=aa.left-ka.left+aa.width/2,cy=aa.top-ka.top+aa.height/2;
  for(var i=0;i<16;i++){
   var p=document.createElement('i');p.className='parca';p.style.left=(cx-3)+'px';p.style.top=(cy-3)+'px';el.appendChild(p);
   var a=(i/16)*Math.PI*2+Math.random()*.3,d=46+Math.random()*34;
   var an=p.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)',opacity:1,offset:.7},{transform:'translate('+Math.cos(a)*d*1.1+'px,'+(Math.sin(a)*d*1.1+14)+'px)',opacity:0}],{duration:900+Math.random()*300,easing:'cubic-bezier(.15,.7,.3,1)'});
   an.onfinish=(function(x){return function(){x.remove();};})(p);
  }
 }
 function hepsi(){YER.forEach(function(y){ciz(y);});}

 /* keep a copy of the holder's photo (TikTok photo links expire after a while) */
 function fotoSakla(r){
  if(!r||!r.foto||r.fotoKaynak===r.foto||!window.fetch||DEMO||ONIZ)return;
  var kaynak=r.foto;
  fetch(kaynak,{mode:'cors',referrerPolicy:'no-referrer'}).then(function(x){if(!x.ok)throw 0;return x.blob();}).then(function(b){
   if(b.size>250000)throw 0;
   var fr=new FileReader();fr.onload=function(){if(r.foto===kaynak){r.fotoV=fr.result;r.fotoKaynak=kaynak;kaydet(true);}};fr.readAsDataURL(b);
  }).catch(function(){});
 }

 function foto(d){
  if(d.profilePictureUrl)return String(d.profilePictureUrl);
  if(d.profilePicture&&d.profilePicture.url&&d.profilePicture.url[0])return String(d.profilePicture.url[0]);
  if(d.userDetails&&d.userDetails.profilePictureUrls&&d.userDetails.profilePictureUrls[0])return String(d.userDetails.profilePictureUrls[0]);
  return '';
 }
 function kimlik(d){return String(d.uniqueId||d.userId||'').trim();}
 function adi(d,id){return String(d.nickname||d.uniqueId||id).trim()||id;}

 function olay(tur,d){
  var simdi=Date.now();
  if(S.son&&simdi-S.son>YENI_YAYIN_MS){S.oturum={};S.kombo={};hepsi();}
  S.son=simdi;
  var id=kimlik(d);
  if(id){ // refresh holder's name and photo whenever they show up
   YER.forEach(function(y){var r=S.rekor[y.anahtar];if(r&&r.id===id){var f=foto(d),a=adi(d,id),deg=false;
    if(f&&f!==r.foto){r.foto=f;deg=true;fotoSakla(r);}if(a!==r.ad){r.ad=a;deg=true;}if(deg){ciz(y);kaydet();}}});
  }
  if(tur==='gift'&&id)hediye(d,id,simdi);
  else kaydet();
 }
 function hediye(d,id,simdi){
  var ad=norm(d.giftName),gid=String(d.giftId==null?'':d.giftId);
  var hedefler=YER.filter(function(y){return y.adlar.some(function(a){return norm(a)===ad||a===gid;});});
  if(!hedefler.length)return kaydet();
  var rc=Math.max(1,Math.floor(Number(d.repeatCount)||1)),artis;
  if(Number(d.giftType)===1){
   var kk=id+'|'+gid+'|'+(d.groupId||''),onceki=S.kombo[kk]?S.kombo[kk].n:0;
   artis=rc>onceki?rc-onceki:(rc<onceki?rc:0);
   S.kombo[kk]={n:rc,t:simdi};
   if(Object.keys(S.kombo).length>300){Object.keys(S.kombo).forEach(function(x){if(simdi-S.kombo[x].t>600000)delete S.kombo[x];});}
  }else{
   var mid=String(d.msgId||'');
   if(mid){S.tekil=S.tekil||[];if(S.tekil.indexOf(mid)>=0)return;S.tekil.push(mid);if(S.tekil.length>200)S.tekil.splice(0,100);}
   artis=rc;
  }
  if(artis<=0)return;
  hedefler.forEach(function(y){
   if(d.giftPictureUrl)S.ikon[y.anahtar]=String(d.giftPictureUrl);
   var ot=S.oturum[y.anahtar]=S.oturum[y.anahtar]||{};
   var o=ot[id]=ot[id]||{id:id,n:0};
   o.n+=artis;o.ad=adi(d,id);o.foto=foto(d)||o.foto||'';
   var r=S.rekor[y.anahtar],ne='';
   if(!r||o.n>r.n){
    if(r&&r.id===id){r.n=o.n;r.ad=o.ad;if(o.foto&&o.foto!==r.foto){r.foto=o.foto;fotoSakla(r);}ne='artti';}
    else{S.rekor[y.anahtar]=r={id:id,ad:o.ad,foto:o.foto,n:o.n,t:simdi};fotoSakla(r);ne='devir';}
    kaydet(true);
   }else kaydet();
   ciz(y,ne);
  });
 }

 /* TikFinity Event API */
 var ADRES=['ws://127.0.0.1:21213/','ws://localhost:21213/'],sira=0,nokta=document.getElementById('nokta');
 if(q.get('durum')==='1')document.body.classList.add('durum');
 function baglan(){
  var ws;
  try{ws=new WebSocket(ADRES[sira%ADRES.length]);}catch(e){sira++;setTimeout(baglan,3000);return;}
  ws.onopen=function(){nokta.classList.add('acik');};
  ws.onmessage=function(e){var m;try{m=JSON.parse(e.data);}catch(x){return;}if(m&&m.event&&m.data)olay(m.event,m.data);};
  ws.onclose=function(){nokta.classList.remove('acik');sira++;setTimeout(baglan,3000);};
  ws.onerror=function(){try{ws.close();}catch(x){}};
 }

 /* sample data for ?demo=1 and ?onizleme=1: blurred stand-in portraits, pixel stand-in items */
 function yuz(i){
  var h=[[340,20],[210,260],[25,45],[160,190],[275,320],[195,230]][i%6];
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><defs><radialGradient id="g" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="hsl('+h[0]+' 65% 72%)"/><stop offset="1" stop-color="hsl('+h[1]+' 45% 30%)"/></radialGradient><filter id="b"><feGaussianBlur stdDeviation="1.6"/></filter></defs>'+
   '<rect width="60" height="60" fill="url(#g)"/><g filter="url(#b)" fill="hsl('+h[1]+' 35% 18%)" opacity=".85"><circle cx="30" cy="26" r="11"/><ellipse cx="30" cy="58" rx="21" ry="16"/></g></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
 }
 function esyaResmi(r,g){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="'+g+'" d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1z"/><path fill="'+r+'" d="M2 1h4v1h1v4H6v1H2V6H1V2h1z"/><path fill="#fff" opacity=".7" d="M2 2h1v1H2z"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
 }
 var kisiler=[['Ayşe Nur','aysenur.mc'],['kerem55','kerem55'],['Mira','mira.blm'],['Deniz Taş','deniztas'],['efe_tr','efe_tr'],['Zeynep','zynp34']];
 function sahte(i,giftName,n,pic){var o=kisiler[i];return {uniqueId:o[1],nickname:o[0],profilePictureUrl:yuz(i),giftName:giftName,giftId:giftName==='Donut'?5879:5655,repeatCount:n,giftType:1,repeatEnd:true,groupId:String(Math.random()),giftPictureUrl:pic};}
 var DONUT=esyaResmi('#ff8fc7','#7a2a55'),GUL=esyaResmi('#ff4d5e','#6a0f19');
 if(ONIZ){
  olay('gift',sahte(1,'Donut',30,DONUT));olay('gift',sahte(3,'Donut',12,DONUT));
  olay('gift',sahte(2,'Rose',85,GUL));olay('gift',sahte(4,'Rose',41,GUL));
  if(q.get('bos')==='1'){S.rekor={};S.oturum={};}
  hepsi();
  if(q.get('devir')==='1')setTimeout(function(){devir(YER[0]);},50);
 }else if(DEMO){
  hepsi();
  olay('gift',sahte(1,'Donut',14,DONUT));olay('gift',sahte(2,'Rose',40,GUL));
  var adim=0;
  setInterval(function(){
   adim++;var i=adim%kisiler.length,gul=adim%3===0;
   var d=sahte(i,gul?'Rose':'Donut',gul?2+Math.floor(Math.random()*12):1+Math.floor(Math.random()*4),gul?GUL:DONUT);
   d.groupId='g'+i+(gul?'r':'d')+Math.floor(adim/12);d.repeatEnd=false;
   var kk=d.uniqueId+'|'+d.giftId+'|'+d.groupId;d.repeatCount=(S.kombo[kk]?S.kombo[kk].n:0)+d.repeatCount;
   olay('gift',d);
  },700);
 }else{
  hepsi();baglan();setInterval(hepsi,60000);if(yeniYayin)kaydet(true);
  YER.forEach(function(y){fotoSakla(S.rekor[y.anahtar]);});
 }
})();
</script>
