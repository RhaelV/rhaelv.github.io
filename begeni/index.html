*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent!important;overflow:hidden}
body{width:320px;-webkit-font-smoothing:antialiased}
.kart{position:relative;width:320px}
.bas{display:flex;align-items:center}
.bas h1{font-weight:inherit;font-size:inherit}
.liste{display:flex;flex-direction:column}
.sira{position:relative;display:flex;align-items:center;isolation:isolate;--p:0}
.av{position:relative;flex:0 0 auto;overflow:hidden}
.av img,.av span{display:block;width:100%;height:100%;object-fit:cover}
.av span{display:grid;place-items:center;color:#fff}
.ad{position:relative;min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.ust{display:flex;align-items:center;gap:8px;min-width:0}
.ust b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:inherit}
.say{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.say svg{flex:0 0 auto;display:block}
.say .pk{display:none}
.say.vur .n{animation:vur .45s cubic-bezier(.2,.8,.2,1)}
.n{display:inline-block}
@keyframes vur{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.alt{display:flex;align-items:center;gap:7px}
.bar{position:relative;flex:1;overflow:hidden;display:block}
.dolu{position:absolute;left:0;top:0;bottom:0;width:calc(100% * var(--p));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.yuzde{flex:0 0 auto;font-style:normal;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
/* "+5 puan" when a viewer passes the next 1000 */
.kazan{position:absolute;right:0;bottom:-4px;padding:1px 8px;border-radius:999px;white-space:nowrap;pointer-events:none;line-height:1.25;
 transform-origin:100% 50%;animation:kazan 1.9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes kazan{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
.sira.kaz .yuzde{opacity:0}
.yuzde{transition:opacity .2s}
.kural{display:flex;align-items:center;justify-content:center;gap:6px}
.kural svg{display:block;flex:0 0 auto}
.bos[hidden]{display:none}
.ikon svg,.kural .pk{display:none}
.canli{display:none}
.nokta{position:fixed;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#ff5a5a;display:none;z-index:9}
.nokta.acik{background:#45c97a}
body.durum .nokta{display:block}

/* ============ A: Turnuva (e-spor yayın tablosu) ============ */
[data-tema=a] body{font-family:"Barlow Condensed",sans-serif;color:#fff}
[data-tema=a] .bas{position:relative;height:42px;padding:0 18px 0 16px;margin-bottom:6px;background:#0b0e14;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);gap:10px}
[data-tema=a] .bas::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#ff2d55}
[data-tema=a] .bas h1{flex:1;font-size:25px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
[data-tema=a] .canli{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;letter-spacing:.12em;color:#ff5c7a}
[data-tema=a] .canli i{width:8px;height:8px;border-radius:50%;background:#ff2d55;animation:nabiz 1.6s infinite}
@keyframes nabiz{0%{box-shadow:0 0 0 0 rgba(255,45,85,.6)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
[data-tema=a] .liste{gap:4px}
[data-tema=a] .sira{height:60px;padding-right:22px;background:linear-gradient(90deg,#161b26,#0f131b);clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%)}
[data-tema=a] .no{align-self:stretch;flex:0 0 42px;display:grid;place-items:center;font-size:29px;font-weight:800;color:#c4cbd8;background:#232a37;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
[data-tema=a] .s1 .no{background:#f5c242;color:#0b0e14}
[data-tema=a] .s2 .no{background:#c9d3e0;color:#0b0e14}
[data-tema=a] .s3 .no{background:#d58a52;color:#0b0e14}
[data-tema=a] .av{width:42px;height:42px;margin-left:6px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
[data-tema=a] .av span{font-size:20px;font-weight:800}
[data-tema=a] .ad{margin-left:11px;gap:5px}
[data-tema=a] .ust b{font-size:22px;font-weight:700;line-height:1}
[data-tema=a] .say{font-size:24px;font-weight:800;line-height:1}
[data-tema=a] .say svg.k{width:14px;height:14px}
[data-tema=a] .bar{height:5px;background:rgba(255,255,255,.1)}
[data-tema=a] .dolu{background:#ff2d55}
[data-tema=a] .yuzde{font-size:16px;font-weight:700;line-height:1;color:#ff8aa0}
[data-tema=a] .s1{height:66px;background:linear-gradient(90deg,rgba(245,194,66,.26),#161b26 55%,#0f131b)}
[data-tema=a] .s1 .av{width:48px;height:48px;box-shadow:inset 0 0 0 2px #f5c242}
[data-tema=a] .s1 .ust b{font-size:24px}
[data-tema=a] .s1 .dolu{background:#f5c242}
[data-tema=a] .s1 .yuzde{color:#f5c242}
[data-tema=a] .kazan{background:#f5c242;color:#0b0e14;font-size:16px;font-weight:800;letter-spacing:.02em}
[data-tema=a] .kural{margin-top:4px;height:32px;background:#0b0e14;font-size:16px;font-weight:700;letter-spacing:.04em;color:#aeb6c6;clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%)}
[data-tema=a] .kural .k{width:13px;height:13px}
[data-tema=a] .kural b{color:#fff}
[data-tema=a] .bos{padding:10px 14px;background:#0f131b;font-size:19px;font-weight:600;color:#9aa3b5;clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%)}

/* ============ B: Sade (minimal) ============ */

<body>
<div class="kart">
 <div class="bas">
  <span class="ikon">
   <svg class="k" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff4d6d" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C14 6.2 15.5 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
   <svg class="kc" viewBox="0 0 26 24" aria-hidden="true"><path transform="translate(-1.3 -1)" fill="#25f4ee" d="M13 21s-7.5-4.6-9.6-9.2C1.9 8.5 4 5 7.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C15 6.2 16.5 5 18.6 5 22 5 24.1 8.5 22.6 11.8 20.5 16.4 13 21 13 21z"/><path transform="translate(1.3 1)" fill="#fe2c55" d="M13 21s-7.5-4.6-9.6-9.2C1.9 8.5 4 5 7.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C15 6.2 16.5 5 18.6 5 22 5 24.1 8.5 22.6 11.8 20.5 16.4 13 21 13 21z"/><path fill="#fff" d="M13 21s-7.5-4.6-9.6-9.2C1.9 8.5 4 5 7.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C15 6.2 16.5 5 18.6 5 22 5 24.1 8.5 22.6 11.8 20.5 16.4 13 21 13 21z"/></svg>
   <svg class="pk" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#5c1634" d="M0 2h1v1h-1zM0 3h1v1h-1zM1 1h1v1h-1zM1 4h1v1h-1zM2 0h1v1h-1zM2 5h1v1h-1zM3 0h1v1h-1zM3 6h1v1h-1zM4 1h1v1h-1zM4 7h1v1h-1zM5 0h1v1h-1zM5 6h1v1h-1zM6 0h1v1h-1zM6 5h1v1h-1zM7 1h1v1h-1zM7 4h1v1h-1zM8 2h1v1h-1zM8 3h1v1h-1z"/><path fill="#ff4f86" d="M1 2h1v1h-1zM1 3h1v1h-1zM2 1h1v1h-1zM2 4h1v1h-1zM3 1h1v1h-1zM3 3h1v1h-1zM3 4h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM4 4h1v1h-1zM5 1h1v1h-1zM5 2h1v1h-1zM5 3h1v1h-1zM5 4h1v1h-1zM6 1h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1z"/><path fill="#d92f66" d="M3 5h1v1h-1zM4 5h1v1h-1zM4 6h1v1h-1zM5 5h1v1h-1zM6 3h1v1h-1zM6 4h1v1h-1zM7 3h1v1h-1z"/><path fill="#ffd1e0" d="M2 2h1v1h-1zM2 3h1v1h-1zM3 2h1v1h-1z"/></svg>
  </span>
  <h1 id="baslik"></h1>
  <span class="canli"><i></i>CANLI</span>
 </div>
 <div class="liste" id="liste"></div>
 <p class="bos" id="bos" hidden></p>
 <p class="kural" id="kural"><svg class="k" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff2d55" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C14 6.2 15.5 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg><svg class="pk" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#5c1634" d="M0 2h1v1h-1zM0 3h1v1h-1zM1 1h1v1h-1zM1 4h1v1h-1zM2 0h1v1h-1zM2 5h1v1h-1zM3 0h1v1h-1zM3 6h1v1h-1zM4 1h1v1h-1zM4 7h1v1h-1zM5 0h1v1h-1zM5 6h1v1h-1zM6 0h1v1h-1zM6 5h1v1h-1zM7 1h1v1h-1zM7 4h1v1h-1zM8 2h1v1h-1zM8 3h1v1h-1z"/><path fill="#ff4f86" d="M1 2h1v1h-1zM1 3h1v1h-1zM2 1h1v1h-1zM2 4h1v1h-1zM3 1h1v1h-1zM3 3h1v1h-1zM3 4h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM4 4h1v1h-1zM5 1h1v1h-1zM5 2h1v1h-1zM5 3h1v1h-1zM5 4h1v1h-1zM6 1h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1z"/><path fill="#d92f66" d="M3 5h1v1h-1zM4 5h1v1h-1zM4 6h1v1h-1zM5 5h1v1h-1zM6 3h1v1h-1zM6 4h1v1h-1zM7 3h1v1h-1z"/><path fill="#ffd1e0" d="M2 2h1v1h-1zM2 3h1v1h-1zM3 2h1v1h-1z"/></svg><span></span></p>
</div>
<i class="nokta" id="nokta"></i>

<template id="kalip">
 <div class="sira">
  <span class="no"></span>
  <span class="av"></span>
  <span class="ad">
   <span class="ust"><b></b><span class="say"><svg class="k" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff2d55" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6l1 1.3 1-1.3C14 6.2 15.5 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg><svg class="pk" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#5c1634" d="M0 2h1v1h-1zM0 3h1v1h-1zM1 1h1v1h-1zM1 4h1v1h-1zM2 0h1v1h-1zM2 5h1v1h-1zM3 0h1v1h-1zM3 6h1v1h-1zM4 1h1v1h-1zM4 7h1v1h-1zM5 0h1v1h-1zM5 6h1v1h-1zM6 0h1v1h-1zM6 5h1v1h-1zM7 1h1v1h-1zM7 4h1v1h-1zM8 2h1v1h-1zM8 3h1v1h-1z"/><path fill="#ff4f86" d="M1 2h1v1h-1zM1 3h1v1h-1zM2 1h1v1h-1zM2 4h1v1h-1zM3 1h1v1h-1zM3 3h1v1h-1zM3 4h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM4 4h1v1h-1zM5 1h1v1h-1zM5 2h1v1h-1zM5 3h1v1h-1zM5 4h1v1h-1zM6 1h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1z"/><path fill="#d92f66" d="M3 5h1v1h-1zM4 5h1v1h-1zM4 6h1v1h-1zM5 5h1v1h-1zM6 3h1v1h-1zM6 4h1v1h-1zM7 3h1v1h-1z"/><path fill="#ffd1e0" d="M2 2h1v1h-1zM2 3h1v1h-1zM3 2h1v1h-1z"/></svg><span class="n"></span></span></span>
   <span class="alt"><i class="bar"><i class="dolu"></i></i><em class="yuzde"></em></span>
  </span>
 </div>
</template>

<script>
(function(){
 var GOSTER=5;                       // kaç kişi görünsün
 var ESIK=1000,PUAN=5;               // her 1000 beğeni = 5 puan (TikFinity'deki "Beğeni Puan" kuralıyla aynı olmalı)
 var YENI_YAYIN_MS=3*60*60*1000;     // bu kadar süre beğeni gelmezse yeni yayın sayılır
 var ANAHTAR='rhaelv-begeni-v1';
 var q=new URLSearchParams(location.search);
 var TEMA=(q.get('tema')||'a').toLowerCase().replace(/[^a-d]/g,'').slice(-1)||'a';
 document.documentElement.dataset.tema=TEMA;
 var YAZI={a:['Beğeni sıralaması','Henüz beğeni yok'],b:['Beğeni sıralaması','İlk beğeniyi atan burada görünür'],
           c:['En çok beğenenler','İlk beğeniyi atan burada görünür'],d:['Beğeni sıralaması','Henüz beğeni yok']}[TEMA];
 document.getElementById('baslik').textContent=YAZI[0];
 var kural=document.getElementById('kural').querySelector('span');
 kural.append('Her '+ESIK.toLocaleString('tr-TR')+' beğeni = ');var kb=document.createElement('b');kb.textContent='+'+PUAN+' puan';kural.appendChild(kb);
 var liste=document.getElementById('liste'),bos=document.getElementById('bos'),kalip=document.getElementById('kalip');
 bos.textContent=YAZI[1];
 if(q.get('durum')==='1')document.body.classList.add('durum');

 var S={u:{},oda:-1,son:0};
 try{var k=JSON.parse(localStorage.getItem(ANAHTAR)||'null');if(k&&k.u)S=k;}catch(e){}
 if(S.son&&Date.now()-S.son>YENI_YAYIN_MS)S={u:{},oda:-1,son:0};

 function kaydet(){
  try{
   var ids=Object.keys(S.u);
   if(ids.length>600){ // sadece en çok beğenen 300 kişiyi tut
    var t=ids.map(function(i){return S.u[i]}).sort(sirala).slice(0,300),y={};
    t.forEach(function(x){y[x.id]=x});S.u=y;
   }
   localStorage.setItem(ANAHTAR,JSON.stringify(S));
  }catch(e){}
 }
 function sirala(a,b){return b.n-a.n||a.ts-b.ts}
 function sifirla(){S={u:{},oda:-1,son:0};EL={};liste.textContent='';}
 function foto(d){
  if(d.profilePictureUrl)return String(d.profilePictureUrl);
  if(d.profilePicture&&d.profilePicture.url&&d.profilePicture.url[0])return String(d.profilePicture.url[0]);
  if(d.userDetails&&d.userDetails.profilePictureUrls&&d.userDetails.profilePictureUrls[0])return String(d.userDetails.profilePictureUrls[0]);
  return '';
 }

 function begeni(d){
  var id=String(d.uniqueId||d.userId||'').trim();if(!id)return;
  var n=Math.max(1,Math.min(1000,Number(d.likeCount)||1));
  var top=Number(d.totalLikeCount),simdi=Date.now();
  if(S.son&&simdi-S.son>YENI_YAYIN_MS)sifirla();
  if(isFinite(top)&&top>=0){
   if(S.oda>2000&&top<S.oda*0.5)sifirla();   // odanın toplamı baştan başladı: yeni yayın
   S.oda=Math.max(S.oda,top);
  }
  var u=S.u[id];
  if(!u)u=S.u[id]={id:id,n:0,ts:simdi,ad:'',foto:''};
  u.n+=n;u.ts=simdi;
  u.ad=String(d.nickname||d.uniqueId||id).trim()||id;
  u.foto=foto(d)||u.foto;
  S.son=simdi;
  planla();
 }

 var EL={},bekliyor=false,sonKayit=0;
 function planla(){
  if(bekliyor)return;bekliyor=true;
  setTimeout(function(){bekliyor=false;ciz();if(Date.now()-sonKayit>2000){sonKayit=Date.now();kaydet();}},180);
 }
 function bas(ad){var c=Array.from(ad.replace(/[^\p{L}\p{N}]/gu,''))[0]||'?';return c.toLocaleUpperCase('tr-TR');}
 function renk(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return 'hsl('+(h%360)+' 38% 40%)';}
 function avatar(el,x){
  var av=el.querySelector('.av');
  if(el.dataset.foto===x.foto&&av.firstChild)return;
  el.dataset.foto=x.foto;av.textContent='';
  var harf=document.createElement('span');harf.textContent=bas(x.ad);harf.style.background=renk(x.id);
  if(x.foto){
   var img=new Image();img.alt='';img.referrerPolicy='no-referrer';
   img.onerror=function(){if(img.isConnected)img.replaceWith(harf);};
   img.src=x.foto;av.appendChild(img);
  }else av.appendChild(harf);
 }
 function kazandi(el){
  var ad=el.querySelector('.ad'),eski=ad.querySelector('.kazan');if(eski)eski.remove();
  var k=document.createElement('span');k.className='kazan';k.textContent='+'+PUAN+' puan';
  ad.appendChild(k);el.classList.add('kaz');
  clearTimeout(el._kz);el._kz=setTimeout(function(){k.remove();el.classList.remove('kaz');},1950);
 }
 function ciz(){
  var top=Object.keys(S.u).map(function(i){return S.u[i]}).sort(sirala).slice(0,GOSTER);
  var once={};Array.prototype.forEach.call(liste.children,function(el){once[el.dataset.id]=el.getBoundingClientRect().top;});
  var kalan={};top.forEach(function(x){kalan[x.id]=1});
  Array.prototype.slice.call(liste.children).forEach(function(el){if(!kalan[el.dataset.id]){el.remove();delete EL[el.dataset.id];}});
  top.forEach(function(x,i){
   var el=EL[x.id],yeni=!el;
   if(yeni){el=kalip.content.firstElementChild.cloneNode(true);el.dataset.id=x.id;EL[x.id]=el;}
   el.className='sira s'+(i+1)+(el.querySelector('.kazan')?' kaz':'');
   el.querySelector('.no').textContent=i+1;
   el.querySelector('.ust b').textContent=x.ad;
   avatar(el,x);
   var p=(x.n%ESIK)/ESIK,eskiN=Number(el.dataset.n||x.n);
   var gecti=!yeni&&Math.floor(x.n/ESIK)>Math.floor(eskiN/ESIK);
   if(gecti){ // just passed a 1000: show +5, let the bar run full, then start again from 0
    el.style.setProperty('--p','1');kazandi(el);
    (function(e,v){setTimeout(function(){var d=e.querySelector('.dolu');d.style.transition='none';e.style.setProperty('--p','0');void d.offsetWidth;d.style.transition='';e.style.setProperty('--p',String(v));},650);})(el,p.toFixed(3));
   }else el.style.setProperty('--p',p.toFixed(3));
   el.dataset.n=x.n;
   el.querySelector('.yuzde').textContent='%'+Math.floor(p*100);
   var say=el.querySelector('.say'),yazi=say.querySelector('.n'),deger=x.n.toLocaleString('tr-TR');
   if(yazi.textContent!==deger){
    if(yazi.textContent){say.classList.remove('vur');void say.offsetWidth;say.classList.add('vur');}
    yazi.textContent=deger;
   }
   liste.appendChild(el);
  });
  Array.prototype.forEach.call(liste.children,function(el){
   var o=once[el.dataset.id],s=el.getBoundingClientRect().top;
   if(!el.animate)return;
   if(o==null)el.animate([{opacity:0,transform:'translateX(-18px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
   else if(Math.abs(o-s)>1)el.animate([{transform:'translateY('+(o-s)+'px)'},{transform:'none'}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
  bos.hidden=top.length>0;
 }

 /* TikFinity Event API */
 var ADRES=['ws://127.0.0.1:21213/','ws://localhost:21213/'],sira=0,nokta=document.getElementById('nokta');
 function baglan(){
  var ws;
  try{ws=new WebSocket(ADRES[sira%ADRES.length]);}catch(e){sira++;setTimeout(baglan,3000);return;}
  ws.onopen=function(){nokta.classList.add('acik');};
  ws.onmessage=function(e){var m;try{m=JSON.parse(e.data);}catch(x){return;}if(m&&m.event==='like'&&m.data)begeni(m.data);};
  ws.onclose=function(){nokta.classList.remove('acik');sira++;setTimeout(baglan,3000);};
  ws.onerror=function(){try{ws.close();}catch(x){}};
 }

 /* örnek veri (sadece ?onizleme=1 ve ?demo=1): fotoğraf yerine tutan bulanık portreler */
 function yuz(i){
  var h=[[340,20],[210,260],[25,45],[160,190],[275,320],[195,230],[0,330]][i%7];
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><defs><radialGradient id="g" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="hsl('+h[0]+' 65% 72%)"/><stop offset="1" stop-color="hsl('+h[1]+' 45% 30%)"/></radialGradient><filter id="b"><feGaussianBlur stdDeviation="1.6"/></filter></defs>'+
   '<rect width="60" height="60" fill="url(#g)"/><g filter="url(#b)" fill="hsl('+h[1]+' 35% 18%)" opacity=".85"><circle cx="30" cy="26" r="11"/><ellipse cx="30" cy="58" rx="21" ry="16"/></g></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
 }
 var ornek=[['Ayşe Nur','aysenur.mc'],['kerem55','kerem55'],['Mira','mira.blm'],['Deniz Taş','deniztas'],['efe_tr','efe_tr'],['Zeynep','zynp34'],['Baran','baran.07']];
 if(q.get('onizleme')==='1'){
  sifirla();var t=Date.now(),sayilar=[15730,10536,7056,1533,830,125,40];
  ornek.forEach(function(o,i){S.u[o[1]]={id:o[1],n:sayilar[i],ts:t+i,ad:o[0],foto:i===4?'':yuz(i)};});
  ciz();
  if(q.get('kazan')==='1')kazandi(liste.children[1]);
 }else if(q.get('demo')==='1'){
  sifirla();
  var bas0=[880,640,520,300,150,60,20];
  ornek.forEach(function(o,i){begeni({uniqueId:o[1],nickname:o[0],likeCount:Math.min(1000,bas0[i]),profilePictureUrl:yuz(i)});});
  setInterval(function(){
   var i=Math.floor(Math.pow(Math.random(),1.6)*ornek.length),o=ornek[i];
   begeni({uniqueId:o[1],nickname:o[0],likeCount:5+Math.floor(Math.random()*25),profilePictureUrl:yuz(i)});
  },300);
 }else{
  ciz();baglan();
 }
})();
</script>
